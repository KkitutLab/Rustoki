[package]
name = "Rustoki"
version = "0.1.0"
edition = "2021"

[dependencies]
nom = "8.0.0"
dotenvy = "0.15.7"
serenity = { version = "0.12.5" , features = ["gateway", "client", "chrono", "cache"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing-subscriber = "0.3.23"
mysql_async = "0.37.0"
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.10.2"
meval = "0.2.0"
once_cell = "1.21.4"
reqwest = { version = "0.13.4", features = ["json"] }
image = "0.25.10"
regex = "1.13.0"
deunicode = "1.6.2"
phf = { version = "0.14.0", features = ["macros"]}
procfs = "0.18.0"
shell-words = "1.1.1"
sha2 = "0.11.0"
hex = "0.4.3"
